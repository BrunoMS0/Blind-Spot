<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Special Elite: máquina de escribir para títulos y cifras. IBM Plex Sans: la interfaz. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #121118; }
      #game { width: 100%; height: 100%; }
      /* Visor de la llamada completa a Jev (tecla V). Texto largo: mejor HTML que Phaser. */
      #call-viewer {
        position: fixed; top: 0; right: 0; width: min(560px, 100vw); height: 100vh; margin: 0; padding: 16px;
        box-sizing: border-box; overflow: auto; white-space: pre-wrap; background: rgba(13, 14, 20, 0.96);
        color: #d8d4c8; font: 12px/1.45 monospace; border-left: 1px solid #3a3f52;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <pre id="call-viewer" hidden></pre>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
